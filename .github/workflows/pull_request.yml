name: Tests

on:
  pull_request:
  push:
    branches:
      - release-v*.*.*

env:
  POETRY_VERSION: "1.8.5"
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

jobs:
  dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run developer workflow
        run: make dev && make livecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run lint tests
        run: |
          pipx install poetry==${POETRY_VERSION}
          poetry install
          poetry run black --check .
          poetry run isort --check .

  unit:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install poetry
        run: pipx install poetry==${POETRY_VERSION}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: poetry install

      - name: Unit tests
        run: make unit

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: make dev

      - name: Run Postman collection
        uses: matt-ball/newman-action@v1
        with:
          collection: tests/integration/openfoodfacts-events.postman_collection.json
          environment: tests/integration/off-local.postman_environment.json
          delayRequest: 5000
      - run: make clean
