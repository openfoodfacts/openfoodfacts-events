[tool.poetry]
name = "openfoodfacts-events"
version = "0.1.0"
description = "Open Food Facts events API"
authors = ["Open Food Facts contributors"]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.6"
uvicorn = "^0.34.0"
SQLAlchemy = "^2.0.37"
starlette-exporter = "^0.23.0"
psycopg2-binary = "^2.9.10"

[tool.poetry.group.dev.dependencies]
black = ">=26.3.1"
flake8 = "^7.1.1"
isort = "^5.13.2"
mypy = "^1.13.0"
pytest = "^8.3.4"
pytest-dotenv = "^0.5.2"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
